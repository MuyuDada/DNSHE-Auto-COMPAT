name: DNSHE Domain Auto Renew

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run renew script
        env:
          DNSHE_API_KEY_1: ${{ secrets.DNSHE_API_KEY_1 }}
          DNSHE_API_SECRET_1: ${{ secrets.DNSHE_API_SECRET_1 }}
          DNSHE_API_KEY_2: ${{ secrets.DNSHE_API_KEY_2 }}
          DNSHE_API_SECRET_2: ${{ secrets.DNSHE_API_SECRET_2 }}
          DNSHE_API_KEY_3: ${{ secrets.DNSHE_API_KEY_3 }}
          DNSHE_API_SECRET_3: ${{ secrets.DNSHE_API_SECRET_3 }}
          DNSHE_API_KEY_4: ${{ secrets.DNSHE_API_KEY_4 }}
          DNSHE_API_SECRET_4: ${{ secrets.DNSHE_API_SECRET_4 }}
          DNSHE_API_KEY_5: ${{ secrets.DNSHE_API_KEY_5 }}
          DNSHE_API_SECRET_5: ${{ secrets.DNSHE_API_SECRET_5 }}
          DNSHE_API_KEY_6: ${{ secrets.DNSHE_API_KEY_6 }}
          DNSHE_API_SECRET_6: ${{ secrets.DNSHE_API_SECRET_6 }}
          DNSHE_API_KEY_7: ${{ secrets.DNSHE_API_KEY_7 }}
          DNSHE_API_SECRET_7: ${{ secrets.DNSHE_API_SECRET_7 }}
          DNSHE_API_KEY_8: ${{ secrets.DNSHE_API_KEY_8 }}
          DNSHE_API_SECRET_8: ${{ secrets.DNSHE_API_SECRET_8 }}
          DNSHE_API_KEY_9: ${{ secrets.DNSHE_API_KEY_9 }}
          DNSHE_API_SECRET_9: ${{ secrets.DNSHE_API_SECRET_9 }}
          DNSHE_API_KEY_10: ${{ secrets.DNSHE_API_KEY_10 }}
          DNSHE_API_SECRET_10: ${{ secrets.DNSHE_API_SECRET_10 }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          SMTP_USE_STARTTLS: ${{ secrets.SMTP_USE_STARTTLS }}
        run: python renew_domains.py
